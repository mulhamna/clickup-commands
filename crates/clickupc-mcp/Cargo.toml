[package]
name = "clickupc-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Unofficial ClickUp MCP server library, shipped inside the clickupc binary"
readme = "README.md"
keywords = ["clickup", "mcp", "mcp-server"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
clickupc-core = { workspace = true }
futures = { workspace = true }
rmcp = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
rmcp = { workspace = true, features = ["client", "transport-streamable-http-client-reqwest"] }
serial_test = { workspace = true }
tempfile = { workspace = true }
wiremock = { workspace = true }
